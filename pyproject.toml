[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surge_sdof"
version = "0.0.0"
description = "Python port of an Excel VBA solver: 1-D MoC water hammer + SDOF pipe response with junction-coupling FSI"
requires-python = ">=3.10"
dependencies = ["numpy", "numba"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "hypothesis", "openpyxl", "oletools"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Golden curve cases are excluded by default; `pytest -m slow` runs the 75 lumped cases
# (~3.5 min), `pytest -m "slow or jc_slow"` adds the 3 junction-coupling cases (hours).
addopts = "-ra -m 'not slow and not jc_slow'"
markers = [
    "slow: golden-master lumped (GetPeakResponse) curve cases, ~3 s each, 75 cases",
    "jc_slow: golden-master junction-coupling (GetPeakResponseJC) curve cases, hours each in pure Python",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
# SIM and C4 were added in Stage 4.4 (the Stage 1 "no simplification" exclusion is over).
# The two frozen Stage 1 modules keep the literal transcription and are exempt from them.
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/surge_sdof/legacy_port.py" = ["SIM", "C4"]
"src/surge_sdof/vba_compat.py" = ["SIM", "C4"]

[tool.ruff.format]
quote-style = "double"
