[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surge_sdof"
version = "0.0.0"
description = "Python port of an Excel VBA solver: 1-D MoC water hammer + SDOF pipe response with junction-coupling FSI"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
# Stage 1 is a literal port: no "simplification" rule families (SIM, PLR, C4) by design.
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
