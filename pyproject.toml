[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surge_sdof"
version = "0.0.0"
description = "Python port of an Excel VBA solver: 1-D MoC water hammer + SDOF pipe response with junction-coupling FSI"
requires-python = ">=3.10"
dependencies = ["numpy", "numba"]

[project.optional-dependencies]
# playwright drives headless Chromium for tests/test_viewer.py; pinned to the version matching
# the pre-installed browser (chromium-1194). The viewer tests skip without it or without a
# browser. The plotly *Python* package is only the source of the plotly.js bundle that
# tools/build_viewer.py inlines into docs/viewer/viewer.html (tests/test_viewer.py pins the
# committed page to the installed bundle, hence the pin); nothing in src/ imports it.
dev = [
    "pytest",
    "ruff",
    "hypothesis",
    "openpyxl",
    "oletools",
    "playwright==1.56.0",
    "plotly==7.1.0",
]
# Session 5b: the sweep plots (tools/sweep_jc.py plot) only.
plots = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Golden curve cases are excluded by default; `pytest -m slow` runs the 75 lumped cases
# (minutes; machine-dependent, ~10 min on a 4-core cloud container), `pytest -m "slow or
# jc_slow"` adds the 3 junction-coupling cases (about an hour or more in pure Python).
addopts = "-ra -m 'not slow and not jc_slow'"
markers = [
    "slow: golden-master lumped (GetPeakResponse) curve cases, 75 cases, minutes in total (machine-dependent)",
    "jc_slow: golden-master junction-coupling (GetPeakResponseJC) curve cases, hours each in pure Python",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
# SIM and C4 were added in Stage 4.4 (the Stage 1 "no simplification" exclusion is over).
# The two frozen Stage 1 modules keep the literal transcription and are exempt from them.
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/surge_sdof/legacy_port.py" = ["SIM", "C4"]
"src/surge_sdof/vba_compat.py" = ["SIM", "C4"]

[tool.ruff.format]
quote-style = "double"
