name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Lint
        run: make lint
      # Fast suite under Numba and with the JIT disabled, after a Numba cache wipe.
      # The slow and jc_slow golden suites stay manual (make slow / make golden).
      - name: Test (both modes)
        run: make test-both
